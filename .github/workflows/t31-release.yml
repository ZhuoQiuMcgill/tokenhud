name: T31 Release copy (temporary)

# On a tag v*: build every binary, test them on their platforms, sign the macOS ones, publish
# a GitHub Release with SHA256SUMS, then publish to npm as this workflow's trusted publisher.
# Tags with a suffix (v0.1.0-rc.1, v0.2.0-beta.2) make prereleases and npm's `next` tag.
#
# Pull requests that touch the release path run everything up to the publishing, so a broken
# build, installer or update is caught before a tag is pushed.
#
# Every smoke test (scripts/build.ts --smoke) runs each binary with --version, with a headless
# --once, as `tokenhud hook` with an event on stdin (silent, then telling a fixture alert),
# as `tokenhud mcp`, which scripts/mcp-smoke.ts drives over stdio as Claude Code does, and
# as `tokenhud selftest workers`, which starts each Worker and round-trips a message through
# it. Each binary is tested on a runner that can execute it (darwin-x64 under Rosetta, where
# the macOS runner has it).

on:
  push:
    branches: [fix/windows-workers]

permissions:
  contents: read

concurrency:
  group: t31-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  # The npm job's. npm's trusted publishing (OIDC) needs Node 22.14 or later, and npm 11.5.1
  # or later to publish, but 11.21.0 or later (12.2.0 on npm 12) to set a dist-tag, as moving
  # `next` does. scripts/publish-npm.ts checks npm before it publishes anything; ci.yml tests
  # it with the same two.
  NODE_VERSION: 24.4.1
  NPM_VERSION: 11.21.0

jobs:
  build:
    name: build all targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check that the tag is the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(bun -e 'process.stdout.write(require("./package.json").version)')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not v$version, the version in package.json"
            exit 1
          fi

      # Every platform's OpenTUI native package, so each binary can embed its own.
      - run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Build
        run: |
          bun scripts/build.ts --release | tee build.log
          { echo '### Binaries'; echo '```'; cat build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The musl binary runs in an Alpine container.
      - name: Smoke test, CLI and MCP server (linux-x64, linux-x64-musl)
        run: bun scripts/build.ts --smoke linux-x64 linux-x64-musl

      # Every npm package as `npm publish` would send it, without sending it. The registry is
      # an address nothing listens on, so this never asks npm anything (npm 11 looks up the
      # published versions even in a dry run).
      - name: npm publish --dry-run
        run: |
          bun scripts/stage-npm.ts
          version=$(bun -e 'process.stdout.write(require("./package.json").version)')
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          for dir in dist/npm/*/; do
            npm publish "$dir" --dry-run --access public --tag "$dist_tag" --registry http://127.0.0.1:9/
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux
          path: |
            dist/tokenhud-linux-*
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-darwin
          path: |
            dist/tokenhud-darwin-*
            dist/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-windows
          path: |
            dist/tokenhud-windows-*
            dist/SHA256SUMS
          if-no-files-found: error

  smoke:
    name: smoke test (${{ matrix.targets }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            artifact: binaries-linux
            targets: linux-arm64 linux-arm64-musl
          - runner: windows-latest
            artifact: binaries-windows
            targets: windows-x64
          - runner: windows-11-arm
            artifact: binaries-windows
            targets: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      # Artifacts don't keep the executable bit.
      - run: chmod +x dist/tokenhud-*
      - name: Smoke test, CLI and MCP server (${{ matrix.targets }})
        run: bun scripts/build.ts --smoke ${{ matrix.targets }}

  # Release-time signing: CI (ci.yml) fails on a bad signature; here a binary that fails
  # `codesign --verify` is re-signed ad hoc, verified again, and that copy is released.
  macos:
    name: sign and smoke test (macOS)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-darwin
          path: dist
      - run: chmod +x dist/tokenhud-darwin-*

      - name: Verify the code signatures, re-signing ad hoc if needed
        run: |
          for bin in dist/tokenhud-darwin-*; do
            if codesign --verify --verbose=2 "$bin"; then
              echo "$bin: signature from bun build is valid" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "::warning::$bin failed codesign --verify; re-signing ad hoc"
            codesign --sign - --force "$bin"
            codesign --verify --verbose=2 "$bin"
            echo "$bin: re-signed ad hoc" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Smoke test, CLI and MCP server (darwin-arm64)
        run: bun scripts/build.ts --smoke darwin-arm64
      - name: Smoke test, CLI and MCP server (darwin-x64, under Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            bun scripts/build.ts --smoke darwin-x64
          else
            echo "darwin-x64 not smoke-tested: this runner has no Rosetta" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Checksums of these copies, for the install test; the release recomputes all of them.
      - run: cd dist && shasum -a 256 tokenhud-darwin-* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-darwin-signed
          path: |
            dist/tokenhud-darwin-*
            dist/SHA256SUMS
          if-no-files-found: error

  # install.sh / install.ps1 and `tokenhud update`, against these binaries served as a fake
  # GitHub release on localhost (test/release/e2e.test.ts). The update starts from a build of
  # this commit that claims an older version.
  e2e:
    name: install and update (${{ matrix.runner }})
    needs: [build, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: binaries-linux
          - runner: macos-latest
            artifact: binaries-darwin-signed
          - runner: windows-latest
            artifact: binaries-windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Build an older version to update from
        run: |
          bun -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = "0.0.1"; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          bun scripts/build.ts
          mkdir old
          mv dist/tokenhud* old/
          git checkout -- package.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - run: chmod +x dist/tokenhud-*

      - name: Installers and update
        env:
          TOKENHUD_E2E_DIST: dist
          TOKENHUD_E2E_OLD: ${{ runner.os == 'Windows' && 'old/tokenhud.exe' || 'old/tokenhud' }}
        run: bun test test/release/e2e.test.ts

