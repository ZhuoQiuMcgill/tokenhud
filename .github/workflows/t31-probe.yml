name: T31 probe (temporary)

on:
  push:
    branches: [fix/windows-workers]

permissions:
  contents: read

jobs:
  cross:
    name: cross-compile the probe (and run linux-x64, linux-x64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: |
          mkdir -p out
          for t in windows-x64 windows-arm64 darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            ext=""; case "$t" in windows-*) ext=".exe" ;; esac
            bun scripts/t31-probe/build.ts "out/probe-$t$ext" "bun-$t" > /dev/null
          done
          bun scripts/t31-probe/build.ts --no-split out/probe-nosplit-windows-x64.exe bun-windows-x64
      - name: linux-x64
        run: ./out/probe-linux-x64 | grep -E '"where"|ERR|nested ->' || echo "probe exit $?"
      - name: linux-x64-musl (Alpine)
        run: |
          docker run --rm -v "$PWD/out:/out" alpine:3.22 sh -c \
            'apk add --no-cache --quiet libstdc++ libgcc && /out/probe-linux-x64-musl' | grep -E '"where"|ERR|nested ->' || echo "probe exit $?"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probes
          path: out/
          if-no-files-found: error

  run:
    name: run (${{ matrix.targets }})
    needs: cross
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            targets: windows-x64.exe nosplit-windows-x64.exe
          - runner: windows-11-arm
            targets: windows-arm64.exe
          - runner: macos-latest
            targets: darwin-arm64 darwin-x64
          - runner: ubuntu-24.04-arm
            targets: linux-arm64 linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probes
          path: out
      - run: chmod +x out/*
      - name: Run
        run: |
          for t in ${{ matrix.targets }}; do
            echo "=== probe-$t"
            case "$t" in
              darwin-x64) cmd=(arch -x86_64 "./out/probe-$t") ;;
              *-musl) cmd=(docker run --rm -v "$PWD/out:/out" alpine:3.22 sh -c "apk add --no-cache --quiet libstdc++ libgcc && /out/probe-$t") ;;
              *) cmd=("./out/probe-$t") ;;
            esac
            "${cmd[@]}" | grep -E '"where"|ERR|nested ->' || echo "probe exit $?"
          done

  # The released Windows binaries, as a user has them: `tokenhud ingest` (a developer
  # command) watching starts the ingest Worker, and says so when it can't.
  released:
    name: released tokenhud ${{ matrix.version }} on windows-x64
    strategy:
      fail-fast: false
      matrix:
        version: [v0.1.3, v0.1.4]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          curl -fsSL --retry 3 -o tokenhud.exe \
            "https://github.com/ZhuoQiuMcgill/tokenhud/releases/download/${{ matrix.version }}/tokenhud-windows-x64.exe"
          t="$RUNNER_TEMP/m"; mkdir -p "$t/home" "$t/xdg"
          HOME="$t/home" USERPROFILE="$t/home" XDG_CONFIG_HOME="$t/xdg" TOKENHUD_WSL_USERS= \
            timeout 20 ./tokenhud.exe ingest --no-import --db "$t/t.db" --cache "$t/c.db" --config "$t/config.json" || echo "exit $?"

  # This branch's selftest in a binary built with 0.1.4's resolver: it must fail, naming the
  # Workers.
  old-resolver:
    name: selftest with 0.1.4's resolver (windows-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --os="*" --cpu="*"
      - run: |
          git show b5f6ad0:src/ingest/worker-url.ts > src/ingest/worker-url.ts
          bun scripts/build.ts --target=bun-windows-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: old-resolver
          path: dist/tokenhud.exe
          if-no-files-found: error
  old-resolver-run:
    name: run selftest with 0.1.4's resolver (windows-x64)
    needs: old-resolver
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: old-resolver
          path: dist
      - run: |
          t="$RUNNER_TEMP/m"; mkdir -p "$t/home"
          HOME="$t/home" USERPROFILE="$t/home" XDG_CONFIG_HOME="$t/xdg" TOKENHUD_WSL_USERS= \
            ./dist/tokenhud.exe selftest workers && { echo "::error::expected a failure"; exit 1; } || echo "exit $? (expected 1)"
