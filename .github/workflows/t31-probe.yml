name: T31 probe (temporary)

on:
  push:
    branches: [fix/windows-workers]
    paths:
      - scripts/t31-probe/**
      - .github/workflows/t31-probe.yml

permissions:
  contents: read

jobs:
  cross:
    name: cross-compile the probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: |
          mkdir -p out
          for t in windows-x64 windows-arm64 darwin-arm64 linux-arm64; do
            ext=""; case "$t" in windows-*) ext=".exe" ;; esac
            bun scripts/t31-probe/build.ts "out/probe-$t$ext" "bun-$t"
            bun scripts/t31-probe/build.ts --no-split "out/probe-nosplit-$t$ext" "bun-$t"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probes
          path: out/
          if-no-files-found: error

  run:
    name: run (${{ matrix.target }})
    needs: cross
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            ext: .exe
          - runner: windows-11-arm
            target: windows-arm64
            ext: .exe
          - runner: macos-latest
            target: darwin-arm64
            ext: ""
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: probes
          path: out
      - run: chmod +x out/*
      - name: Cross-compiled on Linux, with splitting (as the release builds)
        run: ./out/probe-${{ matrix.target }}${{ matrix.ext }} || echo "probe exit $?"
      - name: Cross-compiled on Linux, without splitting (as 0.1.3)
        run: ./out/probe-nosplit-${{ matrix.target }}${{ matrix.ext }} || echo "probe exit $?"
      - name: Built here, with splitting
        run: |
          bun scripts/t31-probe/build.ts "out/native${{ matrix.ext }}"
          ./out/native${{ matrix.ext }} || echo "probe exit $?"
