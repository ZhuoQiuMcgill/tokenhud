name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # ubuntu-latest ships shellcheck; install.sh and the npm package's command must stay
      # POSIX sh.
      - run: shellcheck --shell=sh install.sh npm/tokenhud/bin/tokenhud

  # `claude plugin validate` is local and needs no account: the CLI installs from npm and
  # runs on the runner's empty home. Pinned to the version the plugin was checked with.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      - run: claude plugin validate --strict plugin
      - run: claude plugin validate --strict .

  # scripts/publish-npm.ts, which the release job publishes with: the real npm against a
  # registry on localhost that 404s a platform tarball for a while, and tokenhud published only
  # once it downloads (test/release/publish-npm.test.ts). With the Node and npm release.yml's
  # npm job pins (test/release/publish-npm.test.ts checks they match); none of it may skip.
  publish:
    name: npm publish order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
      - run: npm install --global npm@11.21.0 && npm --version
      - run: bun install --frozen-lockfile
      - name: Publish in order against a registry that serves a tarball late
        shell: bash
        run: |
          bun test test/release/publish-npm.test.ts 2>&1 | tee publish-npm.log
          if grep -Eq '^ *[1-9][0-9]* skip' publish-npm.log || ! grep -Eq '^ *0 fail' publish-npm.log; then
            echo "::error::every publish test must run (with npm on PATH) and pass"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The images the Alpine and Debian tests run in: tests never pull one (test/docker.ts).
      - name: Pull the test images
        if: runner.os == 'Linux'
        run: |
          docker pull --quiet alpine:3.22
          docker pull --quiet debian:13-slim
      - run: bun test

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Bun 1.3.12 and 1.4.0 shipped binaries with broken ad-hoc signatures, which macOS
      # kills on launch. Check before running the binary, and fail loudly: CI does not
      # repair signatures (release signing belongs to M4), so a Bun regression must not
      # slip through as a green job.
      - name: Verify the macOS code signature
        if: runner.os == 'macOS'
        run: |
          if ! codesign --verify --verbose=2 dist/tokenhud; then
            echo "::error::codesign --verify failed: bun build produced dist/tokenhud with an invalid code signature, which macOS refuses to run"
            exit 1
          fi
          echo "codesign: the signature from bun build is valid" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the binary
        run: |
          bin=dist/tokenhud
          if [ "$RUNNER_OS" = "Windows" ]; then bin=dist/tokenhud.exe; fi
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "$RUNNER_OS binary: $bin, $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          expected="tokenhud $(bun -e 'process.stdout.write(require("./package.json").version)')"
          out=$("./$bin" --version)
          echo "--version printed: $out"
          if [ "$out" != "$expected" ]; then
            echo "::error::expected '$expected', got '$out'"
            exit 1
          fi

  # The plugin's hook commands must never block Claude Code, whatever tokenhud a user has
  # (T29 B1): the plugin is served from main, and a tokenhud from before `hook` answers it
  # with exit 2, which Claude Code takes as "block the prompt". scripts/hook-compat.ts runs
  # the plugin's command for each event, and the one `tokenhud mcp install --hooks` writes,
  # through every shell Claude Code uses on the runner (sh; Git Bash and both PowerShells on
  # Windows): against the released 0.1.3, checked against its pinned SHA-256, each run must
  # exit 0 with nothing on stdout; against this build, a fixture alert must come out.
  hook-compat:
    name: hook command vs released tokenhud (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      # The hashes are pinned here, not read from the release: they are 0.1.3's SHA256SUMS
      # entries, so a replaced asset fails the job.
      - name: Download tokenhud 0.1.3 and check it against its pinned checksum
        run: |
          case "$RUNNER_OS" in
            Linux)
              asset=tokenhud-linux-x64 name=tokenhud
              sum=8017bc74db02ea17dd58ed7274f73cc22b8d682fdd5f9216022cedc530de8df1 ;;
            macOS)
              asset=tokenhud-darwin-arm64 name=tokenhud
              sum=1396cd1d25a2a9dd32d07bc992039a78ff068b619ad2edccc18c47698e436ee3 ;;
            Windows)
              asset=tokenhud-windows-x64.exe name=tokenhud.exe
              sum=73e98ded4f8074f66fa57a7656c6db9bb2e93e97ba8cda64165e5bb2388f09f6 ;;
          esac
          mkdir -p old
          curl -fsSL --retry 3 -o "old/$asset" \
            "https://github.com/ZhuoQiuMcgill/tokenhud/releases/download/v0.1.3/$asset"
          if [ "$RUNNER_OS" = macOS ]; then
            (cd old && echo "$sum  $asset" | shasum -a 256 -c -)
          else
            (cd old && echo "$sum  $asset" | sha256sum --check --strict)
          fi
          mv "old/$asset" "old/$name"
          chmod +x "old/$name"

      - name: Against 0.1.3 (no hook command), every run exits 0 with nothing on stdout
        run: bun scripts/hook-compat.ts old --expect silent --version 0.1.3 | tee old.log

      - name: Against this build, the alert comes out
        run: |
          bun scripts/build.ts
          mkdir -p new
          mv dist/tokenhud* new/
          bun scripts/hook-compat.ts new --expect alert | tee new.log

      - name: Every shell ran
        run: |
          want="sh"
          if [ "$RUNNER_OS" = Windows ]; then want="Git Bash, PowerShell 7, Windows PowerShell"; fi
          for log in old.log new.log; do
            if ! grep -q "in $want\$" "$log"; then
              echo "::error::$log does not name every shell: $want"
              exit 1
            fi
          done

  # `bun add -g tokenhud` and `npm install -g tokenhud` end to end
  # (test/release/npm-e2e.test.ts): this OS's packages, staged by scripts/stage-npm.ts and
  # packed by `bun pm pack`, from a fake npm registry on localhost. bun runs with no Node on
  # PATH, npm with no Bun; each installs a build that says 0.0.1, runs --version, doctor and
  # update --print, runs in a project whose .env and bunfig.toml must not reach tokenhud,
  # and `tokenhud update` moves it to this build through its package manager. On Windows,
  # bun's command must fail before anything runs.
  install:
    name: install with bun and npm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Build this version, and an older one to update from
        run: |
          bun scripts/build.ts
          mkdir -p e2e/new e2e/old
          mv dist/tokenhud* e2e/new/
          bun -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = "0.0.1"; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          bun scripts/build.ts
          mv dist/tokenhud* e2e/old/
          git checkout -- package.json

      # Both tests must run: one skipped (no npm on the runner) fails the job.
      - name: Install, run and update with bun (no Node) and npm (no Bun)
        env:
          TOKENHUD_NPM_E2E_NEW: ${{ runner.os == 'Windows' && 'e2e/new/tokenhud.exe' || 'e2e/new/tokenhud' }}
          TOKENHUD_NPM_E2E_OLD: ${{ runner.os == 'Windows' && 'e2e/old/tokenhud.exe' || 'e2e/old/tokenhud' }}
        run: |
          bun test test/release/npm-e2e.test.ts 2>&1 | tee npm-e2e.log
          if ! grep -Eq '^ *2 pass' npm-e2e.log || ! grep -Eq '^ *0 fail' npm-e2e.log; then
            echo "::error::both install tests (bun and npm) must run and pass"
            exit 1
          fi

  # The same on Alpine (musl, BusyBox sh), in a container: the musl binaries, bun's musl
  # build, and Node and npm from Alpine's packages. The musl package is installed by name
  # beside tokenhud, as the README says.
  install-alpine:
    name: install with bun and npm (alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Every platform's OpenTUI native package, so the musl binaries can embed theirs.
      - run: bun install --frozen-lockfile --os="*" --cpu="*"

      - name: Build this version, and an older one to update from, for musl
        run: |
          bun scripts/build.ts --target=bun-linux-x64-musl
          mkdir -p e2e/new e2e/old
          mv dist/tokenhud e2e/new/
          bun -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = "0.0.1"; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          bun scripts/build.ts --target=bun-linux-x64-musl
          mv dist/tokenhud e2e/old/
          git checkout -- package.json

      # Checked against the SHA-256 in that release's SHASUMS256.txt.
      - name: Bun for musl, the version CI pins
        run: |
          curl -fsSL -o bun-linux-x64-musl.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64-musl.zip
          echo "4835eca59d6da70f4674f5642f6e459dcadab773695b2ed9922d131057989742  bun-linux-x64-musl.zip" | sha256sum --check --strict

      - name: Install, run and update in Alpine with bun (no Node) and npm (no Bun)
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e TOKENHUD_NPM_E2E_NEW=e2e/new/tokenhud -e TOKENHUD_NPM_E2E_OLD=e2e/old/tokenhud \
            alpine:3.22 sh -euc '
              apk add --no-cache --quiet libstdc++ libgcc nodejs npm
              mkdir -p /opt && unzip -q bun-linux-x64-musl.zip -d /opt
              export PATH="/opt/bun-linux-x64-musl:$PATH"
              bun test test/release/npm-e2e.test.ts 2>&1 | tee /tmp/npm-e2e.log
              if ! grep -Eq "^ *2 pass" /tmp/npm-e2e.log || ! grep -Eq "^ *0 fail" /tmp/npm-e2e.log; then
                echo "::error::both install tests (bun and npm) must run and pass on Alpine"
                exit 1
              fi
            '
