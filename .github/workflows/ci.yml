name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # ubuntu-latest ships shellcheck; install.sh must stay POSIX sh.
      - run: shellcheck --shell=sh install.sh

  # `claude plugin validate` is local and needs no account: the CLI installs from npm and
  # runs on the runner's empty home. Pinned to the version the plugin was checked with.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      - run: claude plugin validate --strict plugin
      - run: claude plugin validate --strict .

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Bun 1.3.12 and 1.4.0 shipped binaries with broken ad-hoc signatures, which macOS
      # kills on launch. Check before running the binary, and fail loudly: CI does not
      # repair signatures (release signing belongs to M4), so a Bun regression must not
      # slip through as a green job.
      - name: Verify the macOS code signature
        if: runner.os == 'macOS'
        run: |
          if ! codesign --verify --verbose=2 dist/tokenhud; then
            echo "::error::codesign --verify failed: bun build produced dist/tokenhud with an invalid code signature, which macOS refuses to run"
            exit 1
          fi
          echo "codesign: the signature from bun build is valid" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the binary
        run: |
          bin=dist/tokenhud
          if [ "$RUNNER_OS" = "Windows" ]; then bin=dist/tokenhud.exe; fi
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "$RUNNER_OS binary: $bin, $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          expected="tokenhud $(bun -e 'process.stdout.write(require("./package.json").version)')"
          out=$("./$bin" --version)
          echo "--version printed: $out"
          if [ "$out" != "$expected" ]; then
            echo "::error::expected '$expected', got '$out'"
            exit 1
          fi

  # `bun add -g tokenhud` and `npm install -g tokenhud` end to end
  # (test/release/npm-e2e.test.ts): this OS's packages, staged by scripts/stage-npm.ts and
  # packed by `bun pm pack`, from a fake npm registry on localhost. bun runs with no Node on
  # PATH, npm with no Bun; each installs a build that says 0.0.1, runs --version, doctor and
  # update --print, and `tokenhud update` moves it to this build through its package manager.
  install:
    name: install with bun and npm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Build this version, and an older one to update from
        run: |
          bun scripts/build.ts
          mkdir -p e2e/new e2e/old
          mv dist/tokenhud* e2e/new/
          bun -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = "0.0.1"; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          bun scripts/build.ts
          mv dist/tokenhud* e2e/old/
          git checkout -- package.json

      # Both tests must run: one skipped (no npm on the runner) fails the job.
      - name: Install, run and update with bun (no Node) and npm (no Bun)
        env:
          TOKENHUD_NPM_E2E_NEW: ${{ runner.os == 'Windows' && 'e2e/new/tokenhud.exe' || 'e2e/new/tokenhud' }}
          TOKENHUD_NPM_E2E_OLD: ${{ runner.os == 'Windows' && 'e2e/old/tokenhud.exe' || 'e2e/old/tokenhud' }}
        run: |
          bun test test/release/npm-e2e.test.ts 2>&1 | tee npm-e2e.log
          if ! grep -Eq '^ *2 pass' npm-e2e.log || ! grep -Eq '^ *0 fail' npm-e2e.log; then
            echo "::error::both install tests (bun and npm) must run and pass"
            exit 1
          fi
