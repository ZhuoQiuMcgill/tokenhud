name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  # `claude plugin validate` is local and needs no account: the CLI installs from npm and
  # runs on the runner's empty home. Pinned to the version the plugin was checked with.
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      - run: claude plugin validate --strict plugin
      - run: claude plugin validate --strict .

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Bun 1.3.12 and 1.4.0 shipped binaries with broken ad-hoc signatures, which macOS
      # kills on launch. Check before running the binary, and fail loudly: CI does not
      # repair signatures (release signing belongs to M4), so a Bun regression must not
      # slip through as a green job.
      - name: Verify the macOS code signature
        if: runner.os == 'macOS'
        run: |
          if ! codesign --verify --verbose=2 dist/tokenhud; then
            echo "::error::codesign --verify failed: bun build produced dist/tokenhud with an invalid code signature, which macOS refuses to run"
            exit 1
          fi
          echo "codesign: the signature from bun build is valid" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the binary
        run: |
          bin=dist/tokenhud
          if [ "$RUNNER_OS" = "Windows" ]; then bin=dist/tokenhud.exe; fi
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "$RUNNER_OS binary: $bin, $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          expected="tokenhud $(bun -e 'process.stdout.write(require("./package.json").version)')"
          out=$("./$bin" --version)
          echo "--version printed: $out"
          if [ "$out" != "$expected" ]; then
            echo "::error::expected '$expected', got '$out'"
            exit 1
          fi
